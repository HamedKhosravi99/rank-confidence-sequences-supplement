[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcs"
version = "0.1.0"
description = "Rank confidence sequences: anytime-valid rank sets, top-k sets and tiers for leaderboards"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
experiments = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["rcs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
